name: "🩺 Доктор улея"

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: doctor
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: "Кэш локального мозга"
        id: braincache
        uses: actions/cache@v4
        with:
          path: ~/brain
          key: brain-qwen05b-q4km-v1

      - name: "Скачать локальный мозг"
        if: steps.braincache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/brain
          curl -L --fail -o ~/brain/brain.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf

      - name: "Этаж 1 · проверка Copilot"
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "🩺 Этаж 1 (Copilot): секрет COPILOT_PAT не задан — этаж спит."
            exit 0
          fi
          npm install -g @github/copilot >/dev/null 2>&1
          if copilot -p "Скажи ровно: УЛЕЙ ЖИВ" -s --no-ask-user 2>&1 | rg -q "УЛЕЙ ЖИВ"; then
            echo "🩺 Этаж 1 (Copilot): ЖИВ."
          else
            echo "🩺 Этаж 1 (Copilot): секрет есть, но аутентификация не прошла — проверь подписку Copilot."
          fi

      - name: "Этаж 2 · стенд нейромозга (сырой вывод)"
        env:
          TITLE: "🧪 Тест-драйв: проверка нейромозга"
          BODY: "Хочу, чтобы улей умел переводить выпуски на английский и отвечал на двух языках."
        run: |
          pip install -q llama-cpp-python
          python3 - <<'PY'
          import json, os, pathlib, re
          title = os.environ.get("TITLE", "")
          body = os.environ.get("BODY", "")[:800]
          llm = Llama = None
          from llama_cpp import Llama
          llm = Llama(os.path.expanduser("~/brain/brain.gguf"), n_ctx=1024, verbose=False)
          out = llm.create_chat_completion(
              messages=[
                  {"role": "system", "content": "Ты триаж-агент репозитория. Отвечай ТОЛЬКО JSON вида {\"labels\":[\"...\"],\"summary\":\"...\",\"plan\":[\"...\",\"...\",\"...\"]}. Метки только из списка: bug, enhancement, question, documentation, good first issue. Кратко, по-русски, дружелюбно."},
                  {"role": "user", "content": "Заголовок выпуска: " + title + "\n\nТело выпуска:\n" + body},
              ],
              max_tokens=220, temperature=0.2)
          text = out["choices"][0]["message"]["content"]
          print("=== RAW MODEL OUTPUT (начало) ===")
          print(text[:800])
          print("=== RAW MODEL OUTPUT (конец) ===")
          m = re.search(r"\{[\s\S]*\}", text)
          print("JSON найден:", bool(m))
          if m:
              print("Экстракт:", m.group(0)[:400])
          PY
