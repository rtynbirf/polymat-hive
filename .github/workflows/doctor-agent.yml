name: "🩺 Доктор улея"

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: doctor
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: "Криминалистика Copilot CLI"
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          npm install -g @github/copilot >/dev/null 2>&1
          echo "== версия CLI =="
          copilot --version 2>&1 | head -3
          echo "== вариант 1: COPILOT_GITHUB_TOKEN =="
          copilot -p "Скажи ровно: УЛЕЙ ЖИВ" -s --no-ask-user 2>&1 | head -15
          echo "== вариант 2: GITHUB_TOKEN =="
          GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN" copilot -p "Скажи ровно: УЛЕЙ ЖИВ" -s --no-ask-user 2>&1 | head -15
          echo "== вариант 3: GH_TOKEN =="
          GH_TOKEN="$COPILOT_GITHUB_TOKEN" copilot -p "Скажи ровно: УЛЕЙ ЖИВ" -s --no-ask-user 2>&1 | head -15
