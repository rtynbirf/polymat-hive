name: "🩺 Доктор улея"

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: doctor
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: "Установить Copilot CLI"
        run: npm install -g @github/copilot

      - name: "Контрольный вызов модели"
        id: probe
        continue-on-error: true
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          model: gpt-4.1
          max-tokens: "50"
          system-prompt: "Отвечай ровно то, что попросили, без пояснений."
          prompt: "Скажи ровно: УЛЕЙ ЖИВ"

      - name: "Поставить диагноз"
        run: |
          resp="${{ steps.probe.outputs.response }}"
          if echo "$resp" | rg -q "УЛЕЙ ЖИВ"; then
            echo "🩺 Диагноз: организм здоров — Copilot CLI отвечает."
          else
            echo "🩺 Диагноз: связь с моделью хромает. Ответ модели: '$resp'"
            echo "Проверь секрет COPILOT_PAT и подписку Copilot."
          fi
