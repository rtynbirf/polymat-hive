name: "🧠 Триаж-агент"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: "Этаж 1 · Copilot CLI"
        id: analyze
        continue-on-error: true
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          model: gpt-4.1
          system-prompt: |
            Ты — Триаж-агент живого репозитория-организма «Полимат-Улей».
            Верни СТРОГО один JSON-объект, без markdown-ограждений и пояснений:
            {"labels": ["..."], "summary": "одно предложение по-русски", "plan": ["шаг 1", "шаг 2", "шаг 3"]}
            Метки выбирай ТОЛЬКО из списка: bug, enhancement, question, documentation, "good first issue".
            Будь конкретным и дружелюбным. Язык ответа: русский.
          prompt: |
            Заголовок выпуска: ${{ github.event.issue.title }}

            Тело выпуска:
            ${{ github.event.issue.body }}

      - name: "Кэш локального мозга"
        id: braincache
        if: steps.analyze.outputs.response == ''
        uses: actions/cache@v6
        with:
          path: ~/brain
          key: brain-qwen05b-q4km-v1

      - name: "Скачать локальный мозг (Qwen2.5-0.5B GGUF)"
        if: steps.analyze.outputs.response == '' && steps.braincache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/brain
          curl -L --fail -o ~/brain/brain.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf

      - name: "Этаж 2 · Локальный нейромозг"
        if: steps.analyze.outputs.response == ''
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          pip install -q llama-cpp-python
          python3 - <<'PY'
          import json, os, pathlib, re
          title = os.environ.get("TITLE", "")
          body = os.environ.get("BODY", "")[:800]
          allowed = ["bug", "enhancement", "question", "documentation", "good first issue"]
          labels, summary, plan = ["question"], "Экипаж принял выпуск в обработку.", ""
          try:
              from llama_cpp import Llama
              llm = Llama(os.path.expanduser("~/brain/brain.gguf"), n_ctx=1024, verbose=False)
              out = llm.create_chat_completion(
                  messages=[
                      {"role": "system", "content": "Ты триаж-агент репозитория. Отвечай ТОЛЬКО JSON вида {\"labels\":[\"...\"],\"summary\":\"...\",\"plan\":[\"...\",\"...\",\"...\"]}. Метки только из списка: bug, enhancement, question, documentation, good first issue. Кратко, по-русски, дружелюбно."},
                      {"role": "user", "content": "Заголовок выпуска: " + title + "\n\nТело выпуска:\n" + body},
                  ],
                  max_tokens=300, temperature=0.2)
              text = out["choices"][0]["message"]["content"]
              print("🧠 сырой ответ мозга:", text[:400])
              m = re.search(r"\{[\s\S]*\}", text)
              frag = m.group(0) if m else (text[text.find("{"):] if "{" in text else None)
              d = None
              if frag:
                  dec = json.JSONDecoder()
                  for close in ["", "}", "\"}", "\"}]", "]}"]:
                      try:
                          obj, _ = dec.raw_decode(frag + close)
                          if isinstance(obj, dict):
                              d = obj
                              break
                      except Exception:
                          continue
              if d:
                  ls = [str(x).lower().strip() for x in (d.get("labels") or []) if str(x).lower().strip() in allowed]
                  if ls:
                      labels = ls[:2]
                  if d.get("summary"):
                      summary = str(d["summary"])[:200]
                  raw_plan = d.get("plan")
                  if isinstance(raw_plan, str):
                      raw_plan = [raw_plan]
                  plist = [str(p).strip() for p in (raw_plan or []) if str(p).strip().lower() not in ("none", "null", "")]
                  plan = "\n".join("%d. %s" % (i + 1, p) for i, p in enumerate(plist[:3]))
              else:
                  low = (title + " " + body).lower()
                  kw = [("bug", ["ошиб", "баг", "не работа", "падает", "краш"]),
                        ("enhancement", ["хочу", "умел", "добав", "перевод", "поддержк", "улучш", "фича"]),
                        ("question", ["?", "как ", "почему", "можно ли"]),
                        ("documentation", ["документац", "readme", "инструкц"])]
                  ls = [lab for lab, words in kw if any(w in low for w in words)]
                  if ls:
                      labels = ls[:2]
                  summary = "Инстинкты распознали тему: " + title[:120]
                  print("🧠 JSON не распознан — метки по инстинктам:", labels)
          except Exception as e:
              print("нейромозг молчит:", e)
          if not plan:
              plan = "1. Уточнить детали у автора.\n2. Проверить похожие выпуски.\n3. Взять в работу."
          pathlib.Path("reply.json").write_text(json.dumps(
              {"labels": ",".join(labels), "summary": summary, "plan": plan}, ensure_ascii=False), encoding="utf-8")
          PY

      - name: "Разобрать ответ этажа 1"
        id: parse
        if: steps.analyze.outputs.response != ''
        env:
          REPLY: ${{ steps.analyze.outputs.response }}
        run: |
          printf '%s' "$REPLY" > reply.json
          python3 - <<'PY'
          import json, re, pathlib
          raw = pathlib.Path("reply.json").read_text(encoding="utf-8")
          raw = re.sub(r"```[a-zA-Z]*", "", raw).strip()
          data = {}
          m = re.search(r"\{[\s\S]*\}", raw)
          if m:
              try:
                  data = json.loads(m.group(0))
              except Exception:
                  data = {}
          labels = ",".join([str(x).lower().strip() for x in (data.get("labels") or [])][:3])
          summary = str(data.get("summary") or "Экипаж принял выпуск в обработку.")
          plan = "\n".join("%d. %s" % (i + 1, p) for i, p in enumerate((data.get("plan") or [])[:5]))
          pathlib.Path("reply.json").write_text(json.dumps(
              {"labels": labels, "summary": summary, "plan": plan}, ensure_ascii=False), encoding="utf-8")
          PY

      - name: "Поставить метки и ответить"
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const allowed = ['bug','enhancement','question','documentation','good first issue','help wanted'];
            let d = { labels: '', summary: 'Экипаж принял выпуск в обработку.', plan: '' };
            try { d = Object.assign(d, JSON.parse(fs.readFileSync('reply.json', 'utf8'))); } catch (e) {}
            const { owner, repo } = context.repo;
            const n = context.issue.number;
            let labels = String(d.labels || '').split(',').map(s => s.trim()).filter(l => allowed.includes(l));
            if (labels.length === 0) labels = ['question'];
            for (const l of labels) {
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [l] });
              } catch (e) {
                try {
                  await github.rest.issues.createLabel({ owner, repo, name: l, color: '0E8A16' });
                  await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [l] });
                } catch (e2) {}
              }
            }
            const plan = String(d.plan || '').trim() || '1. Дождаться уточнений от автора.';
            const body = '🧠 **Триаж-агент** на связи.\n\n> ' + String(d.summary) +
              '\n\n**План экипажа:**\n' + plan +
              '\n\n_Метки выданы автоматически: ' + labels.join(', ') +
              '. Экипаж живёт в GitHub Actions: Copilot → локальный GGUF-мозг → инстинкты._';
            await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['🤖 экипаж'] });
            } catch (e) {}
