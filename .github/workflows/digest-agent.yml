name: "📰 Дайджест-агент"

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Установить Copilot CLI"
        run: npm install -g @github/copilot

      - name: "Собрать хронику за 24 часа"
        id: chronicle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=$(git log --since="24 hours ago" --pretty=tformat:"- %s · %an" || true)
          issues=$(gh issue list --state open --limit 20 --json number,title -q '.[] | "- #\(.number) \(.title)"' || true)
          {
            echo "LOG<<EOLOG"
            printf '%s\n' "$log"
            echo "EOLOG"
            echo "ISSUES<<EOISS"
            printf '%s\n' "$issues"
            echo "EOISS"
          } >> "$GITHUB_OUTPUT"

      - name: "Попросить модель написать дайджест"
        id: analyze
        continue-on-error: true
        if: steps.chronicle.outputs.LOG != ''
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          model: gpt-4.1
          temperature: "0.4"
          max-tokens: "700"
          system-prompt: |
            Ты — Дайджест-агент живого репозитория «Полимат-Улей».
            Напиши короткий markdown-дайджест дня на русском: заголовок ##,
            3–5 пунктов о проделанном, финальная строка «Настроение экипажа: …».
            Без преамбул и ограждений, только markdown.
          prompt: |
            Коммиты за сутки:
            ${{ steps.chronicle.outputs.LOG }}

            Открытые выпуски:
            ${{ steps.chronicle.outputs.ISSUES }}

      - name: "Записать DIGEST.md"
        if: steps.analyze.outputs.response != ''
        env:
          REPLY: ${{ steps.analyze.outputs.response }}
        run: |
          printf '%s\n' "$REPLY" > DIGEST.md
          printf '\n---\n_Сгенерировано Дайджест-агентом · Copilot CLI · %s (UTC)_\n' "$(date -u '+%Y-%m-%d %H:%M')" >> DIGEST.md

      - name: "Закоммитить дайджест"
        run: |
          git config user.name "digest-agent[bot]"
          git config user.email "actions@github.com"
          git add DIGEST.md
          if git diff --cached --quiet; then echo "Событий не было — коммит пропущен"; exit 0; fi
          git commit -m "📰 дайджест: $(date -u +%Y-%m-%d) [skip ci]"
          git push
